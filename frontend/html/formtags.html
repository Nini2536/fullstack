<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body ALIGN="CENTER" bgcolor="GREY">
    <h1>REGISTRATION FORM</h1><BR>
    <FORM>
        <LABEL><B>FIRST NAME</B></LABEL><BR>
        <INPUT TYPE="TEXT"><BR><BR>
        <LABEL><B>MIDDLE NAME</B></LABEL><BR>
        <INPUT TYPE="TEXT"><BR><BR>
        <LABEL><B>LAST NAME</B></LABEL><BR>
        <INPUT TYPE="TEXT"><BR><BR>
         <LABEL><B>DOB</B></LABEL><BR>
        <INPUT TYPE="date"><BR><BR><BR>
        <SELECT>
            <OPTION>COURSE</OPTION>
            <OPTION>AI</OPTION>
            <OPTION>ML</OPTION>
            <OPTION>PYTHON</OPTION>
            <OPTION>JAVA</OPTION>
        </SELECT><BR><BR><BR>
        <LABEL><B>GENDER</B></LABEL><BR>
        <INPUT TYPE="radio" NAME="QW">MALE 
        <INPUT TYPE="radio" NAME="QW">FEMALE 
        <INPUT TYPE="radio" NAME="QW">OTHERS<BR><BR><BR>
        <LABEL><B>MOBILE NUMBER</B></LABEL><BR>
        <INPUT TYPE="number"><BR><BR>
        <LABEL><B>EMAIL</B></LABEL><BR>
        <INPUT TYPE="email"><BR><BR>
        <LABEL><B>PASSWORD</B></LABEL><BR>
        <INPUT TYPE="password"><BR><BR>
        <LABEL><B>RETYPE PASSWORD</B></LABEL><BR>
        <INPUT TYPE="password"><BR><BR>
        <INPUT TYPE="reset">  
        <BUTTON>SUBMIT</BUTTON>

    </FORM>
</body>
</html>
