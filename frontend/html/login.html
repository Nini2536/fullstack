<!DOCTYPE html>
<html>
<head>
    <title>Secure Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 400px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #203a43;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #203a43;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2c5364;
            transform: translateY(-2px);
        }

        .page {
            display: none;
            animation: fade 0.6s ease;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .active {
            display: block;
        }

        p {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: #203a43;
            font-weight: 600;
            cursor: pointer;
        }

        .msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <!-- REGISTER -->
    <div id="registerPage" class="page active">
        <h2>Create Account</h2>

        <input type="text" id="ruser" placeholder="Username">
        <input type="password" id="rpass" placeholder="Password">

        <button onclick="register()">Register</button>

        <p class="msg" id="rmsg"></p>

        <p>
            Already have an account?
            <a onclick="showLogin()">Login</a>
        </p>
    </div>

    <!-- LOGIN -->
    <div id="loginPage" class="page">
        <h2>Login</h2>

        <input type="text" id="luser" placeholder="Username">
        <input type="password" id="lpass" placeholder="Password">

        <button onclick="login()">Login</button>

        <p class="msg" id="lmsg"></p>

        <p>
            New user?
            <a onclick="showRegister()">Register</a>
        </p>
    </div>

</div>

<script>
    function showLogin() {
        document.getElementById("registerPage").classList.remove("active");
        document.getElementById("loginPage").classList.add("active");
    }

    function showRegister() {
        document.getElementById("loginPage").classList.remove("active");
        document.getElementById("registerPage").classList.add("active");
    }

    function register() {
        var u = document.getElementById("ruser").value;
        var p = document.getElementById("rpass").value;

        if (u === "" || p === "") {
            document.getElementById("rmsg").innerHTML = "Please fill all fields";
            return;
        }

        if (localStorage.getItem("username") === null) {
            localStorage.setItem("username", u);
            localStorage.setItem("password", p);
            document.getElementById("rmsg").style.color = "green";
            document.getElementById("rmsg").innerHTML = "Registration successful";
        } else {
            document.getElementById("rmsg").style.color = "red";
            document.getElementById("rmsg").innerHTML = "Account already exists";
        }
    }

    function login() {
        var u = document.getElementById("luser").value;
        var p = document.getElementById("lpass").value;

        var su = localStorage.getItem("username");
        var sp = localStorage.getItem("password");

        if (u === su && p === sp) {
            document.getElementById("lmsg").style.color = "green";
            document.getElementById("lmsg").innerHTML = "Login successful ✅";
        } else {
            document.getElementById("lmsg").style.color = "red";
            document.getElementById("lmsg").innerHTML = "Invalid credentials ❌";
        }
    }
</script>

</body>
</html>
